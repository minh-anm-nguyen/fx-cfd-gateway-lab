# The acceptance transcript from design doc 19.1, executable.
#
# Note on one deliberate deviation: the transcript ends with a kill after the
# outbox commit and a restart. A scenario cannot kill its own process, so the
# crash half of the transcript lives in the crash suite (test_crash, W4/W6) and
# this file covers the business half.
scenario_id: lp-demo-acceptance-v1
seed: 20261030
clock: virtual
fill_trigger_policy: scripted
emit_pending_cancel: true
initial_quote:
  symbol: EURUSD
  bid: '1.08480'
  ask: '1.08490'
  bid_available: 80000
  ask_available: 40000
  version: 1
  ttl_ms: 60000
events:
  - {at_ms: 0, action: expect_logon}
  - {at_ms: 10, action: expect_new, cl_ord_id: O1, qty: 100000, side: BUY, limit: '1.08500'}
  - {at_ms: 20, action: inject_fill, order: O1, qty: 40000, price: '1.08490'}
  - {at_ms: 30, action: inject_quote, symbol: EURUSD, ask: '1.08495', ask_available: 20000, version: 2, ttl_ms: 60000}
  - {at_ms: 40, action: expect_cancel, cl_ord_id: C1, orig_cl_ord_id: O1}
  - {at_ms: 45, action: inject_fill, order: O1, qty: 20000, price: '1.08495'}
  - {at_ms: 50, action: finalize_cancel, request: C1}
  # A disconnect loses nothing: the ledger and the outbox survive, and the
  # session resumes without resetting sequence numbers (A-07, A-16).
  - {at_ms: 60, action: disconnect}
  - {at_ms: 70, action: reconnect}
  - {at_ms: 71, action: assert, assert: 'CumQty(O1) == 60000'}
assert:
  - 'CumQty(O1) == 60000'
  - 'LeavesQty(O1) == 0'
  - 'OrdStatus(O1) == CANCELED'
  - 'count_distinct_fills(O1) == 2'
  - 'session_and_business_invariants_hold == true'
