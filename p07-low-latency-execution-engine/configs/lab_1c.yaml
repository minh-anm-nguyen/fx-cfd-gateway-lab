# Single-CPU profile. The placement planner refuses to pin here, because one
# allowed CPU cannot both run the pipeline and leave a housekeeping core
# (LI-32). The engine still runs correctly, unpinned, and the manifest records
# that no placement claim is available.
profile: lab-p07-v1-1c
fix_mode: simulator_only
owner_shards: 1
spsc_capacity: 1024
pool_slots: 8192
owner_cpu: auto_from_allowed_cpuset
telemetry_buffer_per_thread: 1024
allocation_policy: preallocated_hot_path
watermarks: {watch_pct: 50, shed_new_pct: 75, stop_pct: 90}
durability: p06_atomic_store_required
outbox_send_requires: p06_committed_epoch
failure_mode: recon_only_on_unknown_commit
metrics: {clock: monotonic_raw, full_benchmark_samples: true}
attempt_pinning: false
commit_mode: synchronous
persistence_inflight_budget: 1
sync_on_commit: true
